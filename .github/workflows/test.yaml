name: Python Specification

on:
  push:
    branches:
      - master
      - mainnet
      - 'forks/**'
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  json_infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          submodules: recursive
          fetch-depth: 0  # Fetch full history for commit comparison
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: ./.github/actions/setup-env
      - name: Determine fork options for json_infra
        id: select-tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Skip if BASE_SHA is null or all zeros (first push)
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "BASE_SHA is null or invalid, skipping test selection"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "Comparing commits: $BASE_SHA...$HEAD_SHA"
          FORK_ARGS=$(python .github/scripts/select_tests.py "$BASE_SHA" "$HEAD_SHA")
          echo "Fork arguments: $FORK_ARGS"
          echo "fork_args=$FORK_ARGS" >> $GITHUB_OUTPUT
      - name: Run json infra tests
        if: steps.select-tests.outputs.should_run == 'true'
        run: tox -e json_infra -- ${{ steps.select-tests.outputs.fork_args }}
      - name: Upload coverage reports to Codecov
        if: steps.select-tests.outputs.should_run == 'true'
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        with:
          files: .tox/coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
